spring:
  application:
    name: dc-ai-code-generator
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.darkecage.dcaicodegenerator.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
# 应用业务配置
app:
  app-name-default-length: 12
  app-name-max-length: 20
  user-page-size-max: 20
  featured-priority-threshold: 99
  code-output-root-dir: ${user.dir}/tmp/code_output
  code-deploy-root-dir: ${user.dir}/tmp/code_deploy
  code-deploy-host: http://localhost
